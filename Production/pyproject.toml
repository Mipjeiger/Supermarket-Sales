[project]
name = "supermarket-sales"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Pyrefly type checker — tells it where to find the `app` package
[tool.pyrefly]
source-directories = ["."]
python-interpreter = "/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11"