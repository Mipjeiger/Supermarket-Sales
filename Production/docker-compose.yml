services:

  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: postgres_sales
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales_network

  # MLFlow Server
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    container_name: mlflow_sales
    ports:
      - "5002:5000"
    environment:
      MLFLOW_TRACKING_URI: /mlflow
    volumes:
      - ./mlflow:/mlflow # Local file-based storage for MLflow artifacts
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow --default-artifact-root /mlflow/artifacts

  # FastAPI Backend
  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: fastapi_sales
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./Models:/app/Models
      - ./mlflow:/app/mlflow
      - ./app:/app/app
    networks:
      - sales_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Streamlit Dashboard
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: streamlit_sales
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    environment:
      - FASTAPI_URL=http://fastapi:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./dashboard:/app/dashboard
      - ./Models:/app/Models
      - ./mlflow:/app/mlflow
    networks:
      - sales_network
    command: streamlit run dashboard/app_ui.py --server.port=8501 --server.address=0.0.0.0

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_sales
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - sales_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_sales
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - sales_network

volumes:
  prometheus_data:
  grafana_data:

networks:
  sales_network:
    driver: bridge